# The test papers of math-aware-source-digest (plan section 6.1).
#
# Only data that anyone may send to a cloud model, share and commit: the
# public domain, CC0, CC BY and CC BY-SA, checked for each paper. Each paper
# is pinned by its SHA-256, so that results are reproducible. Citation fields
# come from the records (masd resolve), not from this file.
#
#   masd testdata list               what is pinned, and what is in the cache
#   masd testdata fetch              download the papers with fetch = "auto"
#   masd testdata import <pdf>...    add papers downloaded by hand (fetch = "manual")
#
# Roles: "judged" (ground truth from two Opus judges), "latex" (an openly
# licensed arXiv LaTeX gives an exact ground truth), "jats" (an openly licensed
# PMC XML), "open" (drafting and checking, gate 6), "example" (documentation),
# "reserve" (checked and pinned, not yet used).

